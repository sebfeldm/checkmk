# Configuration of the Checkmk agent plug-in "check_sybase" (SAP ASE / Sybase).
#
# Location: /etc/check_mk/check_sybase.cfg (or ${MK_CONFDIR}/check_sybase.cfg)
# Contains database passwords, so restrict access:
#   chown root:root /etc/check_mk/check_sybase.cfg
#   chmod 0600 /etc/check_mk/check_sybase.cfg
#
# One [SID] section per ASE instance. The SID is used as isql server name (-S) and as part of
# the Checkmk service names. Settings before the first section apply to all instances and can
# be overridden per instance.
#
# Values are used verbatim: no quotes, and no trailing spaces unless intended.
#
# Available settings (default in brackets):
#   user              ASE login used by isql (-U)                     [required]
#   password          password of that login                          [required]
#   os_user           OS user that runs isql via "su -"               [syb<sid in lower case>]
#   password_via      "stdin" = hand the password to isql via stdin,
#                     "argv"  = via -P (visible in the process list)  [stdin]
#   timeout           timeout for isql in seconds                     [60]
#   errorlog          path of the ASE errorlog, "off" disables it     [/sybase/<SID>/ASE-16_0/install/<SID>.log]
#   errorlog_window   only report errorlog lines of the last N hours  [24]
#   errorlog_pattern  extended regex (grep -E) for errorlog lines     [error:|error ]
#   errorlog_ignore_case  match the pattern case-insensitively (yes/no) [yes]
#
# All thresholds are configured in the Checkmk GUI, not here.

# Global defaults
timeout=60

[ABC]
user=sapsa
password=secret

# [XYZ]
# user=sapsa
# password=other-secret
# errorlog=/sybase/XYZ/ASE-16_0/install/XYZ.log
